name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Impede que a Action gere uma imagem de erro caso não haja dados suficientes
          plugins_errors_fatal: no
          
          # Configurações globais
          base: ""
          config_timezone: Europe/Lisbon
          
          # Plugin Habits / Radar de Atividades com fallback de dados
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
