name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações visuais e de segurança
          base: ""
          plugins_errors_fatal: no
          config_timezone: Europe/Lisbon
          
          # Plugin Habits configurado de forma segura
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 60
          plugin_habits_charts: yes
          plugin_habits_trim: yes
